name: Generate Contribution Arcade

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Pac-Man Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GH_TOKEN }}

      - name: Generate Public & Private Repo Charts
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request
          from collections import Counter

          token = os.environ.get("GH_TOKEN", "")
          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}
          repos = []
          page = 1
          while True:
              url = f"https://api.github.com/user/repos?affiliation=owner&per_page=100&page={page}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode())
                  if not data:
                      break
                  repos.extend(data)
                  page += 1

          pub_repos = [r for r in repos if not r.get("private")]
          priv_repos = [r for r in repos if r.get("private")]

          def make_svg(title, items, filename):
              total = len(items)
              langs = Counter([r["language"] or "Other" for r in items]).most_common(4)
              bars = ""
              y = 88
              for lang, count in langs:
                  pct = round((count / total) * 100) if total > 0 else 0
                  bar_w = max(8, int((pct / 100) * 210))
                  bars += f'''
                  <text x="20" y="{y}" fill="#8b949e" font-family="sans-serif" font-size="12">{lang}</text>
                  <rect x="125" y="{y - 10}" width="210" height="10" rx="3" fill="#21262d"/>
                  <rect x="125" y="{y - 10}" width="{bar_w}" height="10" rx="3" fill="#6B8E23"/>
                  <text x="345" y="{y}" fill="#8b949e" font-family="sans-serif" font-size="11">{count} ({pct}%)</text>
                  '''
                  y += 26
              if not langs:
                  bars = '<text x="20" y="100" fill="#8b949e" font-family="sans-serif" font-size="12">Belum ada data repository</text>'

              svg = f'''<svg width="410" height="195" viewBox="0 0 410 195" fill="none" xmlns="http://www.w3.org/2000/svg">
                <text x="20" y="30" fill="#6B8E23" font-family="sans-serif" font-size="15" font-weight="bold">{title}</text>
                <text x="20" y="58" fill="#8b949e" font-family="sans-serif" font-size="22" font-weight="bold">{total} <tspan font-size="13" font-weight="normal">Repositories</tspan></text>
                {bars}
              </svg>'''
              os.makedirs("dist", exist_ok=True)
              with open(f"dist/{filename}", "w") as f:
                  f.write(svg)

          make_svg("Public Repositories", pub_repos, "public-repos.svg")
          make_svg("Private Repositories", priv_repos, "private-repos.svg")
          EOF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
